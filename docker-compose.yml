version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: naido_postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - naido_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5436:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: naido_backend
    env_file: .env
    ports:
      - "3090:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - naido_uploads:/app/uploads
      - ./backend/src:/app/src
    restart: unless-stopped

  backend_python:
    build: ./backend_python
    container_name: naido_backend_python
    env_file: .env
    ports:
      - "3091:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - naido_uploads:/app/uploads
      - ./backend/src:/app/src
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: naido_frontend
    ports:
      - "8095:80"
    depends_on:
      - backend
      - backend_python
    restart: unless-stopped

volumes:
  naido_pgdata:
  naido_uploads:
