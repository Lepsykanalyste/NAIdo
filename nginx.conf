server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location ~ ^/api/articles/[^/]+/composition {
        proxy_pass http://naido_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location ~ ^/api/(articles|stock|emplacements|vente|achat|qhse|rh|gmao|utilisateurs) {
        proxy_pass http://naido_backend_python:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location /api/ {
        proxy_pass http://naido_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
