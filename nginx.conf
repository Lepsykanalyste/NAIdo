server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Routes Python FastAPI (articles, stock, emplacements, vente, achat, QHSE)
    location ~ ^/api/(articles|stock|emplacements|vente|achat|qhse) {
        proxy_pass http://naido_backend_python:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Toutes les autres routes API → Node.js
    location /api/ {
        proxy_pass http://naido_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Frontend React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
