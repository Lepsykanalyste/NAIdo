server {
    listen 80;
    client_max_body_size 25m;

    # Adresse reelle du visiteur : Cloudflare la fournit dans CF-Connecting-IP. On ne croit cet en-tete que si la requete
    # vient du tunnel local (reseau Docker) : une requete directe du reseau de l'usine ne peut pas se faire passer pour une autre.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    root /usr/share/nginx/html;
    index index.html;

    # DF : seule la vue /view reste sur le backend Python ; le PDF (/pdf) est genere par le backend Node (modele paysage)
    location ~ ^/api/df/[^/]+/view {
        proxy_pass http://naido_backend_python:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
    # OF : le PDF (/api/of/<id>/pdf) est genere par le backend Node (plus par Python)

    location ~ ^/api/ticket-prod/[^/]+/pdf {
        proxy_pass http://naido_backend_python:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location ~ ^/api/(articles|stock|emplacements|vente|qhse|rh|gmao|utilisateurs|permissions|parametres|logs|ia) {
        proxy_pass http://naido_backend_python:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://naido_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://naido_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    }
}
