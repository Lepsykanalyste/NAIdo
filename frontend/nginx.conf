server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # PDFs via Python WeasyPrint
    location ~ ^/api/(df|of)/[^/]+/pdf {
        proxy_pass http://naido_backend_python:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Reste Python
    location ~ ^/api/(articles|stock|emplacements|vente|achat|qhse|rh|gmao|utilisateurs|permissions|parametres|logs|ia) {
        proxy_pass http://naido_backend_python:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    # Node.js
    location /api/ {
        proxy_pass http://naido_backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
